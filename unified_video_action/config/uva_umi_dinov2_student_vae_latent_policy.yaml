# UMI policy-only fine-tuning with an early-patch student tokenizer. A frozen
# KL-VAE supervises the final 16-channel latent while frozen shallow DINOv2
# supervises the tokenizer features used to produce that latent.
name: uva_umi_dinov2_student_vae_latent_policy

defaults:
  - uva_umi_multi
  - override /model/student_tokenizer: small
  - _self_

model:
  policy:
    selected_training_mode: policy_model
    action_model_params:
      predict_action: true
      act_model_type: conv_fc

    # Use robot state as policy input, but do not add an auxiliary pose-prediction
    # objective. This experiment trains only the action policy and tokenizer.
    use_proprioception: true
    predict_proprioception: false
    shift_action: false
    different_history_freq: true

    # Keep the official UMI MAR fully trainable. Its checkpoint path is supplied
    # by the launch script; the new tokenizer is trained jointly from scratch.
    freeze_mar: false
    keep_mar_pos_and_fake_trainable: false
    keep_mar_action_head_trainable: false

    use_student_tokenizer: true
    student_tokenizer_backend: transformer
    student_tokenizer_params:
      # Patchify RGB immediately so no 256x256 hidden feature maps are retained.
      early_patchify: true

    teacher_type: dinov2
    dinov2_teacher_params:
      model_name: dinov2_vits14
      img_size: 224
      model_img_size: 518
      checkpoint_path: pretrained_models/dinov2/dinov2_vits14_pretrain.pth
      loader: timm
      # ViT-S/14 has 12 blocks; "shallow" selects block 4.
      feature_layer: shallow

    # Feature-space supervision for the student token representation.
    align_params:
      enable: true
      coeff: 0.02
      loss_type: hybrid
      teacher_mode: mode
      align_on: token_feat
      use_projector: true
      projector_dim: 512
      mse_coeff: 0.25
      stats_coeff: 0.1

    # Coordinate-space supervision for the exact latent passed into MAR.
    # mode() gives the deterministic KL-VAE target instead of injecting sampling
    # noise into a deterministic student tokenizer.
    vae_latent_distill_params:
      enable: true
      coeff: 0.05
      loss_type: mse
      teacher_mode: mode

    optimizer:
      learning_rate: 1.0e-4

# Keep the source UMI DataLoader behavior, reducing only the per-device batch.
task:
  dataset:
    dataloader_cfg:
      batch_size: 16
      num_workers: 14
      shuffle: true
      pin_memory: true
      persistent_workers: true

training:
  # 8 GPUs x batch 16 x accumulation 1 gives global batch 128.
  gradient_accumulate_every: 1
  lr_warmup_steps: 1000
  resume: false

logging:
  project: uva
  name: train_uva_umi_dinov2_student_vae_latent_policy
  tags:
    - umi
    - cup_arrangement_0
    - policy_model
    - no_proprioception_prediction
    - student_tokenizer_small
    - early_patchify
    - dinov2_vits14_block4
    - vae_latent_distillation
    - frozen_teachers
    - official_umi_pretrained
    - full_mar_finetune
