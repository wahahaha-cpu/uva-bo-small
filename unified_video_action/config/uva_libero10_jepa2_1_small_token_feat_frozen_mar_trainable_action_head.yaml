# V-JEPA 2.1 token-feature alignment with the video-pretrained MAR frozen and
# a randomly initialized conv_fc action head left trainable.
name: uva_libero10_jepa2_1_small_token_feat_frozen_mar_trainable_action_head

defaults:
  - uva_libero10_jepa2_1_small_token_feat
  - _self_

model:
  policy:
    freeze_mar: true
    keep_mar_pos_and_fake_trainable: false
    keep_mar_action_head_trainable: true
    autoregressive_model_params:
      pretrained_model_path: checkpoints/libero10_video.ckpt
    action_model_params:
      predict_action: true
      act_model_type: conv_fc
    selected_training_mode: policy_model

training:
  lr_warmup_steps: 2000
  resume: false

logging:
  project: uva-repa-jepa
  name: train_uva_libero10_jepa2_1_small_token_feat_frozen_mar_trainable_action_head
  tags:
    - train_uva_libero10_jepa2_1_small_token_feat_frozen_mar_trainable_action_head
    - libero10
    - jepa2_1_teacher
    - token_feat_alignment
    - video_pretrained_mar
    - frozen_mar_trunk
    - trainable_action_head
    - conv_fc
